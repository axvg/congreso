name: Actualizar y desplegar

# El Congreso presenta proyectos a diario y publica las actas con uno o dos días
# de retraso. Sin esto el sitio es una foto: se genera una vez y envejece.
on:
  schedule:
    - cron: "0 11 * * *"      # 06:00 en Lima (UTC-5)
  workflow_dispatch:           # y a mano cuando haga falta
  push:
    branches: [main]
    paths: ["build.py", "progress.py", "ingest/**", ".github/workflows/**"]

concurrency:
  group: actualizar
  cancel-in-progress: false    # nunca dos ingestas escribiendo la misma base

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write          # sube la base actualizada al release
    # a nivel de job para poder preguntar por él en el `if` del despliegue
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Instalar dependencias
        run: pip install --quiet cryptography

      # La base es derivada: se puede reconstruir entera desde las APIs, pero eso
      # son horas. Vive como asset del release `base-de-datos`: se baja al
      # empezar y se reemplaza al terminar. No es actions/cache porque la caché
      # solo se guarda cuando el job termina, y un job que necesita la caché
      # para terminar en 120 minutos jamás llegó a sembrarla: 26 corridas
      # canceladas seguidas. El release persiste y no expira.
      - name: Restaurar base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base-de-datos --repo "$GITHUB_REPOSITORY" \
            --pattern congreso.db.zst --output - | zstd -d -f -o data/congreso.db
          ls -lh data/congreso.db

      - name: Ingerir
        run: |
          set -euo pipefail
          python3 -m ingest.run members
          python3 -m ingest.run bills
          python3 -m ingest.run expedientes     # solo los que aún no tienen trámite
          python3 -m ingest.run votes
          python3 -m ingest.run textos          # solo los que aún no tienen texto
          python3 -m ingest.run comisiones      # nómina de la Cámara + mesas del Senado
          # El PTE publica el mes M a comienzos del M+1, así que solo el año en
          # curso se mueve. El backfill 2021-2025 es una vez y vive en la caché.
          python3 -m ingest.run gastos "$(date -u +%Y)"
          python3 -m ingest.run status

      - name: Comisiones desde el Diario
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from ingest import db, committees
          con = db.connect()
          for pdf in sorted((db.ROOT / "data" / "pdf").glob("PLO-*.pdf")):
              ch = "S" if "SENADO" in pdf.name.upper() else "D"
              try:
                  nc, nm, un = committees.ingest(con, ch, pdf)
                  if nm:
                      print(f"{pdf.name}: {nc} comisiones, {nm} asignaciones, {un} sin enlazar")
              except Exception as e:
                  print(f"{pdf.name}: {e!r}")
          PY

      - name: Autochequeos
        run: |
          set -euo pipefail
          for m in spley legislators motions votes committees texts gastos; do
            echo "--- $m"; python3 -m ingest.$m
          done

      - name: Construir
        run: |
          python3 build.py
          python3 progress.py

      - name: Desplegar a Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy site --project-name=congreso-pe --branch=main

      # Solo tras construir y desplegar sin error: una ingesta rota no debe
      # convertirse en la semilla de mañana.
      - name: Guardar base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zstd -9 -T0 -f data/congreso.db -o congreso.db.zst
          gh release upload base-de-datos congreso.db.zst \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Resumen
        run: python3 -m ingest.run status >> "$GITHUB_STEP_SUMMARY"
